name: Android Spec Battle

on:
  push:
    paths:
      - 'android/**'
      - 'supabase/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'supabase/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_SDK_ROOT/platforms/android-36" || {
            echo "Android API 36 is not installed on this runner"
            exit 1
          }

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spec-battle-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

# CI trigger comment: validate the latest Android source fix.
