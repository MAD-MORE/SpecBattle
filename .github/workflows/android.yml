name: Android Spec Battle

on:
  push:
    paths:
      - 'android/**'
      - 'supabase/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'supabase/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 37
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 37
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true; sdkmanager "platforms;android-37"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spec-battle-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
